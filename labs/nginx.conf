server {
    listen 80;
    server_name localhost;

    # =====================================================================
    # Logging (opsional, untuk debugging)
    # =====================================================================
    access_log /var/log/nginx/moodle_access.log;
    error_log  /var/log/nginx/moodle_error.log;

    # =====================================================================
    # Batas ukuran upload (Moodle sering upload file tugas/soal)
    # =====================================================================
    client_max_body_size 100M;              # Maksimal 100 MB per request

    # =====================================================================
    # Timeout yang lebih panjang untuk proses Moodle yang lambat
    # =====================================================================
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # =====================================================================
    # Kompresi gzip untuk mempercepat transfer
    # =====================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # =================================================================
        # Proxy ke container Moodle (port 8080 internal)
        # =================================================================
        proxy_pass http://moodle:8080;

        # Header asli client diteruskan
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # =================================================================
        # Jangan buffer response (agar Moodle bisa mengirimkan progress)
        # =================================================================
        proxy_buffering off;

        # =================================================================
        # Redirect dari Moodle akan mengikuti header Host yang benar
        # =================================================================
        proxy_redirect off;
    }

    # =====================================================================
    # Blokir akses ke file sensitif Moodle (opsional)
    # =====================================================================
    location ~ ^/(\.git|config\.php|phpunit\.xml) {
        deny all;
    }
}